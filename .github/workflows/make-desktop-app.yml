name: Make Desktop App

on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: 'Run the build with debug logging'
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, "${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}"]
        arch: [x64, arm64]
        node-version: [26.12.1]

    uses: ./.github/workflows/reusable-build.yml
    # The called workflow reads CI_ARTIFACTS_S3_SECRET_ACCESS_KEY (our own artifact storage); reusable workflows
    # only see the caller's secrets when they are passed on.
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      node-version: ${{ matrix.node-version }}
