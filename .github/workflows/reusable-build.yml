name: Reusable Electron Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      arch:
        required: true
        type: string
      node-version:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    env:
      NODE_ENV: production
      # GitHub's artifact storage for ever-co is full ("Artifact storage quota has been hit"; Free plan, billing
      # locked), so builds upload to our own storage (MinIO bucket `ci-artifacts`, 14-day expiry) when the repo has
      # the CI_ARTIFACTS_S3_* settings. Forks have none and keep actions/upload-artifact.
      CI_ARTIFACTS_S3: ${{ secrets.CI_ARTIFACTS_S3_SECRET_ACCESS_KEY != '' && vars.CI_ARTIFACTS_S3_BUCKET != '' && vars.CI_ARTIFACTS_S3_ENDPOINT != '' && vars.CI_ARTIFACTS_S3_ACCESS_KEY_ID != '' && 'true' || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'yarn'

      - name: Set up dependencies
        run: |
          python3 -m pip install --break-system-packages --user packaging setuptools
          npm install -g electron-builder
          yarn global add nx@latest

      - name: Install dependencies
        env:
          REC_DESKTOP_ADD_NRWL: ${{ vars.REC_DESKTOP_ADD_NRWL }}
        run: |
          # NODE_ENV=production (job env) makes yarn 1 skip devDependencies, and nx, @nx/* and electron-builder are
          # devDependencies: install them all, the build itself still runs with NODE_ENV=production.
          yarn install --frozen-lockfile --production=false
          # The lockfile already pins nx 22 and @nx/*. Adding the deprecated @nrwl/node and @nrwl/workspace pulls nested
          # older nx copies whose post-install died with "Bus error (core dumped)" on Linux (runs 42274412665, 42359453431).
          # Kept behind a variable in case a build still needs them.
          # The variable comes in through the environment, never pasted into the script.
          if [ "$REC_DESKTOP_ADD_NRWL" = "true" ]; then
            yarn add -D --production=false nx@latest @nrwl/node @nrwl/workspace
          fi

      - name: Build Electron app
        run: |
          npx nx reset
          npx nx run-many --target=build --configuration=production --verbose

      - name: Package Electron app
        run: yarn make

      # One archive of dist/executables/ per OS: its layout differs per maker, and the link is one file.
      - name: Upload Artifacts to CI artifact storage
        if: env.CI_ARTIFACTS_S3 == 'true'
        shell: bash
        env:
          CI_ARTIFACTS_S3_ENDPOINT: ${{ vars.CI_ARTIFACTS_S3_ENDPOINT }}
          CI_ARTIFACTS_S3_BUCKET: ${{ vars.CI_ARTIFACTS_S3_BUCKET }}
          CI_ARTIFACTS_S3_ACCESS_KEY_ID: ${{ vars.CI_ARTIFACTS_S3_ACCESS_KEY_ID }}
          CI_ARTIFACTS_S3_SECRET_ACCESS_KEY: ${{ secrets.CI_ARTIFACTS_S3_SECRET_ACCESS_KEY }}
          CI_ARTIFACTS_S3_DOWNLOAD_ENDPOINT: ${{ vars.CI_ARTIFACTS_S3_DOWNLOAD_ENDPOINT }}
          PREFIX: ever-rec-desktop/${{ github.ref_name }}/${{ github.sha }}/${{ runner.os }}-${{ inputs.arch }}
          NAME: electron-build-${{ runner.os }}-${{ inputs.arch }}
        run: |
          test -n "$(ls -A dist/executables 2>/dev/null)" || { echo "::error::dist/executables/ is empty"; exit 1; }
          tar -czf "$RUNNER_TEMP/$NAME.tar.gz" -C dist executables
          node scripts/ci/upload-ci-artifacts.mjs --self-test
          node scripts/ci/upload-ci-artifacts.mjs --prefix "$PREFIX" "$RUNNER_TEMP/$NAME.tar.gz"

      - name: Upload Artifacts
        if: env.CI_ARTIFACTS_S3 != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: electron-build-${{ inputs.os }}-${{ inputs.arch }}
          path: dist/executables/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Logs (if failure occurs)
        if: failure() && env.CI_ARTIFACTS_S3 != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ github.run_id }}-${{ inputs.os }}
          path: logs/
          retention-days: 7